name: Daily Nudge

on:
  schedule:
    # 23:00 IST = 17:29 UTC should run and complete before users wake up at 8:00 IST
    - cron: '29 17 * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  send-nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache script dependencies
        id: cache-scripts
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: scripts-node-modules-${{ hashFiles('scripts/package-lock.json') }}

      - name: Install script dependencies
        if: steps.cache-scripts.outputs.cache-hit != 'true'
        run: cd scripts && npm ci

      - name: Send daily nudge push notification
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          node scripts/send-nudge.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
          FIREBASE_PROJECT_ID: karcha-efaa5
