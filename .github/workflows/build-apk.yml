name: Build Android APK & Deploy PWA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.py'
      - '**.md'
      - '.github/workflows/sync-sheets.yml'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create GitHub Releases

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node + npm cache ─────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # ── 3. Build web app (base='/' for Capacitor, not GitHub Pages path) ───
      - name: Build web app for Capacitor
        run: npm run build:capacitor
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # ── 4. Add Android platform if this is the first CI run ─────────────────
      - name: Add Android platform (first time only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── 5. Sync Capacitor (copies /dist into Android project) ───────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 6. Java 17 (required by Android Gradle) ─────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 7. Make Gradle wrapper executable ───────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --build-cache

      # ── 9. Upload APK as downloadable artifact ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Publish as GitHub Release (direct download link) ─────────────────
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kharcha.apk

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create latest kharcha.apk \
            --title "Kharcha " \
            --notes "commit ${{ github.sha }}. Download kharcha.apk and install on your Android phone." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Web / PWA — builds with the GitHub Pages base path ('/domanga/') and ────
  # pushes dist/ to the gh-pages branch, same as running `npm run deploy` locally.
  # Runs as its own job (not a step in `build` above) because it needs a
  # different Vite build (`npm run build`, not `build:capacitor` — the base
  # path differs) and has nothing to do with the Android/Gradle toolchain.
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push to gh-pages branch + push rollback tags

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node + npm cache ─────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # ── 3. Build web app (base='/domanga/' for GitHub Pages) ────────────────
      - name: Build web app for GitHub Pages
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # ── 4. Push dist/ to the gh-pages branch (Pages is set to serve from it) ─
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # ── 5. Tag this deploy for rollback — same script `npm run deploy` uses ──
      - name: Tag deploy for rollback
        run: node scripts/tag-deploy.js
