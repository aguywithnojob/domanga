name: Monthly Budget Reset Reminder

on:
  schedule:
    # 1st of every month at ~8:30 AM IST.
    # IST = UTC+5:30, so 8:30 AM IST = 03:00 UTC.
    # GitHub Actions cron is often delayed 15-30 min, scheduling at 02:30 UTC
    # to reliably land around 8-8:30 AM IST.
    - cron: '30 2 1 * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache script dependencies
        id: cache-scripts
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: scripts-node-modules-${{ hashFiles('scripts/package-lock.json') }}

      - name: Install script dependencies
        if: steps.cache-scripts.outputs.cache-hit != 'true'
        run: cd scripts && npm ci

      - name: Send monthly budget reset reminder
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          node scripts/send-monthly-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
          FIREBASE_PROJECT_ID: karcha-efaa5
