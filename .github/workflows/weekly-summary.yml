name: Weekly Expense Summary

on:
  schedule:
    # Every Sunday at ~10 PM IST.
    # IST = UTC+5:30, so 10 PM IST = 16:30 UTC.
    # GitHub Actions cron is often delayed 15-30 min, scheduling at 16:00 UTC
    # to reliably land around 10-10:30 PM IST on Sundays.
    - cron: '00 16 * * 0'
  workflow_dispatch:

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache script dependencies
        id: cache-scripts
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: scripts-node-modules-${{ hashFiles('scripts/package-lock.json') }}

      - name: Install script dependencies
        if: steps.cache-scripts.outputs.cache-hit != 'true'
        run: cd scripts && npm ci

      - name: Send weekly expense summary
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          node scripts/send-weekly-summary.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
          FIREBASE_PROJECT_ID: karcha-efaa5
