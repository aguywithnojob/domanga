<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/domanga/favicon.svg" />
    <link rel="apple-touch-icon" href="/domanga/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Karcha — expense analyzer for couples" />
    <script>
      try {
        var _f = JSON.parse(localStorage.getItem('karcha-flags') || '{}');
        var _primary = _f.enabletheme ? '#2563eb' : '#16a34a';
        document.documentElement.style.backgroundColor = _primary;
        if (_f.enabletheme) {
          document.documentElement.setAttribute('data-theme', 'blue');
          var _m = document.querySelector('meta[name="theme-color"]');
          if (_m) _m.content = '#2563eb';
        }
      } catch(e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Karcha" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Karcha</title>
  </head>
  <body class="bg-karcha-bg font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
